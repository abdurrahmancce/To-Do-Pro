<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App Pro</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <div id="toast-container" aria-live="polite"></div>

  <!-- ALARM NOTIFICATION POPUP -->
  <div class="alarm-popup" id="alarm-popup" style="display:none" role="alertdialog" aria-modal="true" aria-label="Task reminder">
    <div class="alarm-popup-inner">
      <div class="alarm-popup-icon"><i class="fa-solid fa-bell alarm-bell-icon"></i></div>
      <div class="alarm-popup-content">
        <h3 class="alarm-popup-title">Reminder!</h3>
        <p class="alarm-popup-task" id="alarm-popup-task"></p>
        <p class="alarm-popup-note" id="alarm-popup-note"></p>
      </div>
      <div class="alarm-popup-actions">
        <button class="alarm-btn alarm-btn-snooze" id="alarm-snooze-btn"><i class="fa-solid fa-clock-rotate-left"></i> Snooze 5 min</button>
        <button class="alarm-btn alarm-btn-dismiss" id="alarm-dismiss-btn"><i class="fa-solid fa-check"></i> Dismiss</button>
      </div>
    </div>
  </div>

  <div class="app-wrapper">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <header class="app-header">
      <div class="header-left">
        <div class="logo">
          <i class="fa-solid fa-list-check logo-icon"></i>
          <span class="logo-text">To-Do <span class="logo-accent">Pro</span></span>
        </div>
        <p class="header-date" id="header-date"></p>
      </div>
      <div class="header-right">
        <button class="icon-btn alarm-panel-toggle" id="alarm-panel-toggle" title="View upcoming alarms" aria-label="Alarms">
          <i class="fa-solid fa-bell"></i>
          <span class="alarm-badge" id="alarm-badge" style="display:none">0</span>
        </button>
        <button class="icon-btn shortcut-hint" title="Press Ctrl+K to focus search, Ctrl+N for new task, Delete to remove selected" aria-label="Keyboard shortcuts">
          <i class="fa-solid fa-keyboard"></i>
        </button>
        <button class="icon-btn theme-toggle" id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle theme">
          <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
      </div>
    </header>

    <!-- ALARM PANEL -->
    <section class="alarm-panel glass-card" id="alarm-panel" style="display:none" aria-label="Upcoming reminders">
      <div class="alarm-panel-header">
        <span><i class="fa-solid fa-bell"></i> Upcoming Reminders</span>
        <button class="icon-btn" id="alarm-panel-close" aria-label="Close alarm panel"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <ul class="alarm-list" id="alarm-list">
        <li class="alarm-empty-msg">No reminders set yet.</li>
      </ul>
    </section>

    <section class="stats-bar" aria-label="Task statistics">
      <div class="stat-card">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <span class="stat-num accent-green" id="stat-completed">0</span>
        <span class="stat-label">Done</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <span class="stat-num accent-amber" id="stat-pending">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="progress-wrap" title="Completion progress">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-pct" id="progress-pct">0%</span>
      </div>
    </section>

    <section class="add-panel glass-card" aria-label="Add new task">
      <div class="add-panel-top">
        <div class="input-group">
          <i class="fa-solid fa-plus input-icon"></i>
          <input type="text" id="task-input" class="task-input" placeholder="What needs to be done?" maxlength="200" autocomplete="off" aria-label="New task title" />
        </div>
        <button class="add-btn" id="add-btn" title="Add task (Enter)" aria-label="Add task">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
      <div class="add-row">
        <div class="input-group">
          <i class="fa-solid fa-heading input-icon input-icon-sm"></i>
          <input type="text" id="task-heading" class="task-input task-input-sm" placeholder="Section heading (optional)" maxlength="100" autocomplete="off" aria-label="Task section heading" />
        </div>
      </div>
      <div class="add-row">
        <div class="notes-group">
          <i class="fa-solid fa-align-left notes-icon"></i>
          <textarea id="task-notes" class="notes-textarea" placeholder="Add notes or a description…" maxlength="2000" rows="3" aria-label="Task notes"></textarea>
        </div>
      </div>
      <div class="extra-fields">
        <div class="field-wrap">
          <label for="task-date" class="field-label"><i class="fa-regular fa-calendar"></i> Due Date</label>
          <input type="date" id="task-date" class="field-input" aria-label="Due date" />
        </div>
        <div class="field-wrap">
          <label class="field-label"><i class="fa-solid fa-flag"></i> Priority</label>
          <div class="priority-btns" role="radiogroup" aria-label="Priority level">
            <button class="priority-btn" data-priority="low" aria-pressed="false">Low</button>
            <button class="priority-btn active" data-priority="medium" aria-pressed="true">Medium</button>
            <button class="priority-btn" data-priority="high" aria-pressed="false">High</button>
          </div>
        </div>
      </div>
      <!-- ALARM ROW -->
      <div class="extra-fields alarm-row">
        <div class="field-wrap alarm-field-wrap">
          <label class="field-label alarm-label"><i class="fa-solid fa-bell"></i> Reminder Date &amp; Time</label>
          <div class="alarm-inputs">
            <input type="date" id="task-alarm-date" class="field-input" aria-label="Reminder date" />
            <input type="time" id="task-alarm-time" class="field-input" aria-label="Reminder time" />
          </div>
        </div>
        <div class="field-wrap">
          <label class="field-label"><i class="fa-solid fa-rotate"></i> Repeat</label>
          <select id="task-alarm-repeat" class="field-input field-select" aria-label="Repeat alarm">
            <option value="none">No repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
        </div>
      </div>
    </section>

    <div class="controls-bar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search-input" class="search-input" placeholder="Search tasks…" aria-label="Search tasks" />
        <button class="clear-search" id="clear-search" aria-label="Clear search" style="display:none"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="filter-tabs" role="tablist" aria-label="Filter tasks">
        <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true"><i class="fa-solid fa-layer-group"></i> All</button>
        <button class="filter-tab" data-filter="pending" role="tab" aria-selected="false"><i class="fa-regular fa-clock"></i> Pending</button>
        <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false"><i class="fa-solid fa-check-double"></i> Done</button>
      </div>
      <button class="clear-btn" id="clear-completed-btn" title="Clear all completed tasks" aria-label="Clear completed tasks">
        <i class="fa-solid fa-trash-can"></i><span>Clear Done</span>
      </button>
    </div>

    <main class="task-list-wrap">
      <ul id="task-list" class="task-list" aria-label="Task list"></ul>
      <div class="empty-state" id="empty-state" aria-hidden="true">
        <div class="empty-icon"><i class="fa-solid fa-inbox"></i></div>
        <h3 class="empty-title">Nothing here yet</h3>
        <p class="empty-sub">Add a task above to get started on your day.</p>
      </div>
    </main>

    <footer class="app-footer">
      <span>Drag tasks to reorder &nbsp;·&nbsp; <kbd>Ctrl+N</kbd> new &nbsp;·&nbsp; <kbd>Ctrl+K</kbd> search &nbsp;·&nbsp; <kbd>Del</kbd> remove selected</span>
    </footer>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Edit task" style="display:none">
    <div class="modal glass-card">
      <div class="modal-header">
        <h2 class="modal-title"><i class="fa-solid fa-pen-to-square"></i> Edit Task</h2>
        <button class="icon-btn modal-close" id="modal-close" aria-label="Close modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <input type="text" id="edit-input" class="task-input" maxlength="200" aria-label="Edit task title" placeholder="Task title" />
        <div class="add-row" style="margin-top:0.8rem">
          <div class="input-group">
            <i class="fa-solid fa-heading input-icon input-icon-sm"></i>
            <input type="text" id="edit-heading" class="task-input task-input-sm" maxlength="100" placeholder="Section heading (optional)" aria-label="Edit task heading" />
          </div>
        </div>
        <div class="add-row" style="margin-top:0.8rem">
          <div class="notes-group">
            <i class="fa-solid fa-align-left notes-icon"></i>
            <textarea id="edit-notes" class="notes-textarea" maxlength="2000" rows="4" placeholder="Add notes or a description…" aria-label="Edit task notes"></textarea>
          </div>
        </div>
        <div class="extra-fields" style="margin-top:1rem">
          <div class="field-wrap">
            <label for="edit-date" class="field-label"><i class="fa-regular fa-calendar"></i> Due Date</label>
            <input type="date" id="edit-date" class="field-input" aria-label="Edit due date" />
          </div>
          <div class="field-wrap">
            <label class="field-label"><i class="fa-solid fa-flag"></i> Priority</label>
            <div class="priority-btns" id="edit-priority-btns" role="radiogroup" aria-label="Edit priority level">
              <button class="priority-btn" data-priority="low" aria-pressed="false">Low</button>
              <button class="priority-btn" data-priority="medium" aria-pressed="false">Medium</button>
              <button class="priority-btn" data-priority="high" aria-pressed="false">High</button>
            </div>
          </div>
        </div>
        <!-- EDIT MODAL ALARM ROW -->
        <div class="extra-fields alarm-row" style="margin-top:1rem">
          <div class="field-wrap alarm-field-wrap">
            <label class="field-label alarm-label"><i class="fa-solid fa-bell"></i> Reminder Date &amp; Time</label>
            <div class="alarm-inputs">
              <input type="date" id="edit-alarm-date" class="field-input" aria-label="Edit reminder date" />
              <input type="time" id="edit-alarm-time" class="field-input" aria-label="Edit reminder time" />
            </div>
          </div>
          <div class="field-wrap">
            <label class="field-label"><i class="fa-solid fa-rotate"></i> Repeat</label>
            <select id="edit-alarm-repeat" class="field-input field-select" aria-label="Edit repeat alarm">
              <option value="none">No repeat</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-save"><i class="fa-solid fa-check"></i> Save Changes</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
